[project]
name = "crypto-exchange-fees-mcp"
version = "0.1.0"
description = "MCP server: base-tier crypto exchange trading fees, each read from the official fee page and dated."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]
keywords = ["mcp", "crypto", "exchange", "trading-fees", "binance", "okx", "bybit", "hyperliquid"]

[project.urls]
Homepage = "https://nexualpha.com/rates"
Repository = "https://github.com/BestBerlin/crypto-exchange-fees"

[project.scripts]
crypto-exchange-fees-mcp = "crypto_exchange_fees_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_exchange_fees_mcp"]
